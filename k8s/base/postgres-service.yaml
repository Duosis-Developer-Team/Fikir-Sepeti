# StatefulSet için headless service: pod DNS'i stabil olur; uygulama
# "fikirsepeti-postgres:5432" ile bağlanır.
apiVersion: v1
kind: Service
metadata:
  name: fikirsepeti-postgres
  labels:
    app.kubernetes.io/name: fikirsepeti-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: fikirsepeti-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
