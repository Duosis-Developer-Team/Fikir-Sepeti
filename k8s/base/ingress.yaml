# Host tabanlı ingress. İLK KURULUMDA KULLANILMIYOR — erişim NodePort 30090
# üzerinden (bkz. overlays/prod/nodeport-service.yaml). Domain bağlandığında
# overlay'de host patch'lenip bu kaynak devreye alınır.
#
# INGRESS CLASS — `nginx`. Kümede üç controller var; SEÇİM KRİTERİ class adı
# değil, controller'ın HANGİ NAMESPACE'LERİ izlediğidir:
#   ingress-nginx       nginx        (watch: hepsi)     80:31412  443:30772
#   ingress-nginx-test  nginx-test   (watch: hermes-test SADECE)
#   drake-nginx         drake-nginx  -
# `nginx-test` node1'de 80/443'ü karşılıyor olsa da yalnızca hermes-test'i
# izliyor; buradaki bir Ingress'i hiçbir zaman görmez. (LogiSlot bu tuzağa
# düşüp bir gün kaybetti — bkz. onların ingress-patch.yaml notu.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fikirsepeti
  annotations:
    # SSE (/api/realtime) için ZORUNLU: nginx varsayılan olarak yanıtı
    # tamponluyor ve olaylar istemciye ancak tampon dolunca ulaşıyor — yani
    # "canlı" oylama canlı olmuyor. Uygulama X-Accel-Buffering: no da
    # gönderiyor; bu ikinci savunma hattı.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Açık SSE bağlantısı varsayılan 60 sn okuma zaman aşımına takılırdı.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: REPLACE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fikirsepeti-web
                port: { name: http }
