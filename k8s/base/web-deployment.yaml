# Fikir Sepeti web — Next.js standalone (API route'ları da bu süreçte).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fikirsepeti-web
  labels:
    app.kubernetes.io/name: fikirsepeti-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fikirsepeti-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fikirsepeti-web
    spec:
      containers:
        - name: web
          image: ghcr.io/duosis-developer-team/fikir-sepeti:prod
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: fikirsepeti-config }
          # Secret'ın TAMAMI envFrom ile alınmıyor — ADMIN_DATABASE_URL ve
          # POSTGRES_PASSWORD web pod'una GİRMEMELİ. Web yalnızca RLS'e tabi
          # bağlantıyı görüyor; sahip rolünün kimlik bilgisi sadece migration
          # Job'unda. Bir uygulama açığı en kötü ihtimalle RLS'in izin verdiği
          # kadarına ulaşabilsin diye.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: DATABASE_URL }
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: AZURE_CLIENT_ID }
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: AZURE_CLIENT_SECRET }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          # /login oturum gerektirmeyen ve veritabanına dokunmayan tek sayfa —
          # sağlık kontrolü için doğru hedef. Kök (/) landing'e düşüyor ve o da
          # statik, ama /login'in 200 dönmesi Next'in gerçekten ayakta olduğunu
          # gösteriyor. (LogiSlot'ta da aynı seçim.)
          startupProbe:
            httpGet: { path: /login, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
