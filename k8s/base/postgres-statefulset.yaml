# Küme içi PostgreSQL — Hermes ve LogiSlot ile aynı model:
# StatefulSet + local-path PVC.
#
# !!! UYARI: local-path StorageClass reclaimPolicy=Delete'dir.
# PVC'yi silmek VERİYİ SİLER. Önce pg_dump alın (bkz. k8s/README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fikirsepeti-postgres
  labels:
    app.kubernetes.io/name: fikirsepeti-postgres
spec:
  serviceName: fikirsepeti-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fikirsepeti-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fikirsepeti-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: fikirsepeti-secrets, key: POSTGRES_DB }
            # local-path hostPath dizininde initdb'nin "boş dizin" kontrolüne
            # takılmamak için veri alt dizinde tutulur.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
