# ============================================================================
# ÖRNEK DOSYA — GERÇEK DEĞERLERLE DOLDURUP DEPOYA KOYMAYIN, APPLY ETMEYİN.
# Gerçek secret'ı deploy workflow'u kubectl ile oluşturur (bkz. deploy.yml).
# kustomization.yaml bu dosyayı BİLİNÇLİ olarak içermez.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fikirsepeti-secrets
type: Opaque
stringData:
  # Postgres süper kullanıcısı — şemanın SAHİBİ. Migration bununla koşar.
  POSTGRES_USER: "fikirsepeti"
  POSTGRES_PASSWORD: "CHANGE_ME_strong_password"
  POSTGRES_DB: "fikirsepeti"

  # Uygulama rolünün parolası. Migration bu değerle fikirsepeti_app rolünü
  # oluşturur/günceller (db/compat/0000).
  APP_DB_PASSWORD: "CHANGE_ME_app_password"

  # --- İKİ AYRI BAĞLANTI, İKİ AYRI YETKİ ---
  # Bu ayrım güvenlik modelinin merkezinde; birleştirmeyin.
  #
  # DATABASE_URL       → WEB pod'u. fikirsepeti_app rolü: tabloların sahibi
  #                      DEĞİL, dolayısıyla RLS ona uygulanır. Web pod'u asla
  #                      RLS'i atlayan bir bağlantı görmemeli.
  # ADMIN_DATABASE_URL → YALNIZCA migration Job'u. Sahip rolü, RLS atlanır.
  DATABASE_URL: "postgresql://fikirsepeti_app:CHANGE_ME_app_password@fikirsepeti-postgres:5432/fikirsepeti"
  ADMIN_DATABASE_URL: "postgresql://fikirsepeti:CHANGE_ME_strong_password@fikirsepeti-postgres:5432/fikirsepeti"

  # --- Azure Entra ID (Microsoft ile giriş) ---
  # Boş bırakılırsa "Microsoft ile giriş" ucu 503 döner ve arayüz bunu
  # açıkça söyler; e-posta+şifre girişi etkilenmez.
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""
