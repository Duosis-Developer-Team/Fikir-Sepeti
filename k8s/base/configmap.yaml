# Gizli OLMAYAN yapılandırma. Gizli değerler fikirsepeti-secrets'ta yaşar,
# asla burada.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fikirsepeti-config
data:
  NODE_ENV: "production"
  # E-posta sağlayıcısı. log_only: e-postalar GÖNDERİLMEZ, email_outbox
  # tablosuna yazılır (LogiSlot'taki desenin aynısı). SMTP hazır olunca
  # secret'a SMTP_* eklenip bu değer "smtp" yapılır.
  EMAIL_PROVIDER: "log_only"
  # Azure Entra: 'organizations' = herhangi bir iş/okul hesabı. Tek bir
  # şirkete kilitlemek istenirse buraya o tenant'ın GUID'i yazılır.
  AZURE_TENANT_ID: "organizations"
  # Uygulamanın kendini gördüğü adres — Azure redirect_uri bundan türetilir.
  # Domain bağlanınca overlay'de gerçek adresle patch'lenir.
  AZURE_REDIRECT_URI: ""
  # AUTH_BYPASS BURADA YOK ve OLMAMALI: prod imajında tanımlanırsa
  # X-Dev-User başlığı kimlik doğrulamasını komple atlar.
