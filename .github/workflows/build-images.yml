# GHCR imaj build/push. main → :prod + :prod-<sha7>
#
# GHCR YAZMA YETKİSİ: GITHUB_TOKEN yalnızca paket repoya BAĞLIYSA yazabilir.
# Bağ, paketi Actions'ın KENDİSİ oluşturduğunda kurulur.
#
# 2026-09-01'de öğrenildi: elle (yerelden PAT ile) push edilerek oluşmuş bir
# paket repoya bağlı DEĞİLDİR ve `denied: permission_denied: write_package`
# verir. Dockerfile'daki org.opencontainers.image.source etiketiyle sonradan
# push etmek de bağı KURMUYOR — etiket yalnızca paket ilk kez oluşurken
# dikkate alınıyor. Bu yüzden imaj adı `fikir-sepeti-web`'den `fikir-sepeti`'ye
# alındı: yeni adı ilk kez bu workflow yayınladı, paket repoya bağlı doğdu.
# (Eski `fikir-sepeti-web` paketi org'da artık kullanılmıyor, silinebilir.)
# Alternatif: write:packages yetkili bir PAT'i GHCR_TOKEN secret'ı olarak
# ekleyin; aşağıdaki login onu tercih eder.
name: Build Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-push:
    # CI yeşil olmadan imaj üretilmez — kırık kod imaja dönüşüp "hazır" gibi
    # durmasın.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Etiketi belirle
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image_tag=prod-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Etiket: prod-${SHA::7}"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build + push
        run: |
          IMG=ghcr.io/duosis-developer-team/fikir-sepeti
          docker build -t "$IMG:prod" -t "$IMG:${{ steps.meta.outputs.image_tag }}" .
          docker push "$IMG:prod"
          docker push "$IMG:${{ steps.meta.outputs.image_tag }}"

  deploy:
    needs: build-push
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      image_tag: ${{ needs.build-push.outputs.image_tag }}
    secrets: inherit
